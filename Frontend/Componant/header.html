<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Componant/layout.css" />
</head>

<body>

<div class="header">
    <!-- toggle button for mobile -->
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-label="فتح القائمة">
        <svg width="20" height="14" viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 1.5H20" stroke="#fff" stroke-width="2" stroke-linecap="round"></path>
            <path d="M0 7H20" stroke="#fff" stroke-width="2" stroke-linecap="round"></path>
            <path d="M0 12.5H20" stroke="#fff" stroke-width="2" stroke-linecap="round"></path>
        </svg>
    </button>

    <!-- University info -->
    <div class="header-right">
        <div class="logo-circle">🎓</div>
        <div>
            <div class="university-name">جامعة اليرموك</div>
            <div class="university-subtitle">منصة مشاريع التخرج</div>
            <div style="font-size:11px;color:#9ca3af;">Yarmouk University - Graduation Projects</div>
        </div>
    </div>

    <!-- logout button -->
    <button class="logout-btn" aria-label="تسجيل خروج" title="تسجيل خروج" onclick="handleLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </button>
</div>

</body>
</html>
