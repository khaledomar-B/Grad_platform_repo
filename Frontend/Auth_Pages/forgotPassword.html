<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #06324a;
            --mid-blue: #0f4b6b;
            --accent: #ffd34a;
            --form-border: #e6eef6;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", system-ui, Arial;
            background: linear-gradient(180deg, #052d46 0%, #083b57 60%);
            display: grid;
            place-items: center;
            padding: 32px;
            color: #fff;
            overflow-y: auto;
        }

        .wrap {
            width: 420px;
            position: relative;
            text-align: center;
        }

        .card {
            background: linear-gradient(180deg, var(--mid-blue), var(--deep-blue));
            border-radius: 18px;
            padding: 40px 28px 28px;
            box-shadow: 0 10px 30px rgba(2, 18, 33, 0.45);
            position: relative;
        }

        .logo {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -43px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .logo img {
            width: 72%;
            height: auto;
            display: block
        }

        .title {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .subtitle {
            margin-top: 6px;
            color: #ffd34a;
            font-weight: 600;
            font-size: 15px;
        }

        .description {
            margin-top: 12px;
            font-size: 13px;
            color: #e0e7ff;
            line-height: 1.5;
            padding: 0 8px;
        }

        .form-box {
            margin-top: 20px;
            background: #fff;
            color: #1f2937;
            border-radius: 12px;
            padding: 22px;
            direction: rtl;
            text-align: right;
            box-shadow: 0 6px 18px rgba(2, 18, 33, 0.12);
        }

        .form-group {
            position: relative;
            margin-bottom: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 46px 12px 14px;
            border: 1px solid var(--form-border);
            border-radius: 10px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 4px rgba(11, 69, 94, 0.07);
            border-color: #cfe8f5;
        }

        .form-group .icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: inline-grid;
            place-items: center;
            background: #f5f7fb;
            border-radius: 8px;
            color: #0f3b57;
        }

        .btn-send {
            width: 100%;
            margin-top: 8px;
            background: var(--deep-blue);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 18, 33, 0.25);
            transition: background 0.3s ease;
        }

        .btn-send:hover {
            background: #042a3a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #0f3b57;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

            </div>

            <div class="title">نسيت كلمة السر؟</div>
            <div class="subtitle">Reset Your Password</div>

            <div class="description">
                أدخل بريدك الإلكتروني، وسيظهر لك رمز التحقق مباشرة.
            </div>

            <div class="form-box">
                <div class="form-group">
                    <input id="emailInput" type="email" placeholder="البريد الإلكتروني" />
                    <div class="icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f3b57" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </div>
                </div>

                <button class="btn-send" onclick="sendCode()">إرسال كود التحقق</button>

                <p id="codeBox"
                    style="display:none;margin-top:15px;font-weight:700;color:#ffd34a;font-size:18px;text-align:center;">
                </p>

                <a href="login.html" class="back-link">العودة إلى تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        const API = "https://nonverbalized-gushier-alessandra.ngrok-free.dev/api/auth";

        async function sendCode() {
            const email = document.getElementById("emailInput").value;
            if (!email) return alert("أدخل البريد الإلكتروني");

            const res = await fetch(`${API}/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            if (!res.ok) {
                alert(data.message);
                return;
            }

            // عرض الكود للمستخدم
            document.getElementById("codeBox").style.display = "block";
            document.getElementById("codeBox").innerText = "رمزك هو: " + data.code;

            // تخزين الإيميل في التخزين المحلي
            localStorage.setItem("fp_email", email);

            // تحويل بعد 1.5 ثانية
            setTimeout(() => {
                window.location.href = "reset-password.html";
            }, 1500);
        }
    </script>

</html>
