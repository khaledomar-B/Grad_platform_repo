<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --deep-blue: #06324a;
            --mid-blue: #0f4b6b;
            --accent: #ffd34a;
            --form-border: #e6eef6;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", system-ui, Arial;
            background: linear-gradient(180deg, #052d46 0%, #083b57 60%);
            display: grid;
            place-items: center;
            padding: 40px;
            color: #fff;
            overflow-y: auto;
        }

        .wrap {
            width: 600px;
            position: relative;
            text-align: center;
        }

        .card {
            background: linear-gradient(180deg, var(--mid-blue), var(--deep-blue));
            border-radius: 18px;
            padding: 40px 28px 28px;
            box-shadow: 0 10px 30px rgba(2, 18, 33, 0.45);
            position: relative;

        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -43px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .logo img {
            width: 72%;
            height: auto;
            display: block
        }

        .title {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .subtitle {
            margin-top: 6px;
            color: #ffd34a;
            font-weight: 600;
            font-size: 15px;
        }

        .form-box {
            margin-top: 6px;
            background: #fff;
            color: #1f2937;
            border-radius: 12px;
            padding: 10px;
            direction: rtl;
            text-align: right;
            box-shadow: 0 6px 18px rgba(2, 18, 33, 0.12);
        }

        .field-label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #0f3b57;
            font-size: 14px;
        }

        .form-group {
            position: relative;
            margin-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }


        .form-group input {
            width: 100%;
            padding: 12px 46px 12px 14px;
            border: 1px solid var(--form-border);
            border-radius: 10px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }


        .form-group input:focus {
            box-shadow: 0 0 0 4px rgba(11, 69, 94, 0.07);
            border-color: #074969;
        }

        .form-group .icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: inline-grid;
            place-items: center;
            background: #f5f7fb;
            border-radius: 8px;
            color: #0f3b57;
            font-size: 16px;
        }

        .btn-signup {
            width: 100%;
            margin-top: 8px;
            background: var(--deep-blue);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 18, 33, 0.25);
            transition: background 0.3s ease;
        }

        .btn-signup:hover {
            background: #042a3a;
        }

        .links-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
        }

        .login-link {
            color: #0f3b57;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link:hover {
            color: var(--deep-blue);
            text-decoration: underline;
        }

        .terms {
            font-size: 12px;
            color: #6b7280;
            margin-top: 12px;
            text-align: center;
            line-height: 1.6;
        }

        .terms a {
            color: #0f3b57;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        @media (max-width:460px) {
            .wrap {
                width: 92%
            }

            .logo {
                top: -36px;
                width: 74px;
                height: 74px
            }

            .form-row {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

 <script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {

        lastName: document.getElementById("lastName").value.trim(),
        universityId: document.getElementById("universityId").value.trim(),
        email: document.getElementById("email").value.trim(),

    };

    try {

            Swal.fire({
                icon: 'success',
                title: 'تم التسجيل بنجاح 🎉',
                text: result.message || 'تم إنشاء الحساب بنجاح.',

            // ✅ تحويل تلقائي بعد 2 ثانية

        } else {

            });

        console.error(error);
    }
});
</script>
