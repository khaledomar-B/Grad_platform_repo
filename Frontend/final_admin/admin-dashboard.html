<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --deep-blue: #06324a;
            --mid-blue: #0f4b6b;
            --accent: #ffd34a;
            --form-border: #d9e6f1;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", sans-serif;
            background: linear-gradient(180deg, #052d46 0%, #083b57 60%);
            color: #fff;
            padding: 30px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: linear-gradient(180deg, var(--mid-blue), var(--deep-blue));
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(2, 18, 33, 0.45);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .sub {
            text-align: center;
            color: var(--accent);
            margin-bottom: 25px;
            font-size: 15px;
        }

        .table-box {
            background: #fff;
            color: #1f2937;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 18px rgba(2, 18, 33, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
        }

        th {
            background: #083b57;
            color: #fff;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f3f8fc;
        }

        .btn-approve {
            padding: 6px 14px;
            border: none;
            background: var(--deep-blue);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-approve:hover {
            background: #042a3a;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>لوحة تحكم الأدمن</h1>
            <div class="sub">إدارة طلبات المشرفين بانتظار الموافقة</div>

            <div class="table-box">
                <table id="supervisorsTable">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>القسم</th>
                            <th>البريد</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                            <td colspan="4" class="empty">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
    const API_BASE = "https://nonverbalized-gushier-alessandra.ngrok-free.dev/api/admin";

    // جلب المشرفين بانتظار الموافقة
    async function loadPending() {
        const tbody = document.getElementById("tbody");

        try {
            const res = await fetch(`${API_BASE}/pending-supervisors`, {
                headers: {
                    "ngrok-skip-browser-warning": "true"
                }
            });

            const data = await res.json();

            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty">لا يوجد مشرفين بانتظار الموافقة.</td></tr>`;
                return;
            }

            data.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td>${s.firstName} ${s.lastName}</td>
                        <td>${s.department}</td>
                        <td>${s.email}</td>
                        <td>
                            <button class="btn-approve" onclick="approve(${s.id})">موافقة</button>
                        </td>
                    </tr>
                `;
            });

        } catch (e) {
            console.log(e);
            tbody.innerHTML = `<tr><td colspan="4" class="empty">حدث خطأ أثناء تحميل البيانات.</td></tr>`;
        }
    }

    // موافقة مشرف
    async function approve(id) {
        const ok = confirm("هل تريد الموافقة على هذا المشرف؟");
        if (!ok) return;

        const res = await fetch(`${API_BASE}/approve-supervisor/${id}`, {
            method: "PUT",
            headers: {
                "ngrok-skip-browser-warning": "true"
            }
        });

        const data = await res.json();
        alert(data.message);
        loadPending();
    }

    loadPending();
</script>


</body>

</html>
