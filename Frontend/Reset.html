<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>إعادة تعيين كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #06324a;
            --mid-blue: #0f4b6b;
            --accent: #ffd34a;
            --form-border: #e6eef6;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Tajawal", system-ui, Arial;
            background: linear-gradient(180deg, #052d46 0%, #083b57 60%);
            display: grid;
            place-items: center;
            padding: 32px;
            color: #fff;
            overflow-y: auto;
            direction: rtl;
        }

        .wrap {
            width: 420px;
            position: relative;
            text-align: center;
        }

        .card {
            background: linear-gradient(180deg, var(--mid-blue), var(--deep-blue));
            border-radius: 18px;
            padding: 40px 28px 28px;
            box-shadow: 0 10px 30px rgba(2, 18, 33, 0.45);
            position: relative;
        }

        .logo {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -43px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .logo img {
            width: 72%;
            height: auto;
            display: block
        }

        .title {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .subtitle {
            margin-top: 6px;
            color: #ffd34a;
            font-weight: 600;
            font-size: 15px;
        }

        .description {
            margin-top: 12px;
            font-size: 13px;
            color: #e0e7ff;
            line-height: 1.5;
            padding: 0 8px;
        }

        .form-box {
            margin-top: 20px;
            background: #fff;
            color: #1f2937;
            border-radius: 12px;
            padding: 22px;
            direction: rtl;
            text-align: right;
            box-shadow: 0 6px 18px rgba(2, 18, 33, 0.12);
        }

        .form-group {
            position: relative;
            margin-bottom: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--form-border);
            border-radius: 10px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 4px rgba(11, 69, 94, 0.07);
            border-color: #cfe8f5;
        }

        .btn-send {
            width: 100%;
            margin-top: 8px;
            background: var(--deep-blue);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 18, 33, 0.25);
            transition: background 0.3s ease;
        }

        .btn-send:hover {
            background: #042a3a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #0f3b57;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--deep-blue);
            text-decoration: underline;
        }

        @media (max-width:460px) {
            .wrap {
                width: 92%
            }

            .logo {
                top: -36px;
                width: 74px;
                height: 74px
            }
        }
    </style>
</head>

                    alt="logo">
            </div>

            <div class="title">إعادة تعيين كلمة المرور</div>
            <div class="subtitle">Reset Your Password</div>

            <div class="description">
                أدخل الرمز الذي حصلت عليه من صفحة "نسيت كلمة السر" ثم اختر كلمة مرور جديدة.
            </div>

            <div class="form-box">
                <div class="form-group">
                    <input type="text" id="code" placeholder="رمز التحقق">
                </div>

                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
                </div>

                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
                </div>

                <button class="btn-send" type="button" onclick="handleReset()">
                    تأكيد
                </button>

                <a href="login.html" class="back-link">العودة إلى تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        // مؤقتًا: فقط نتحقق من الحقول ونرجع المستخدم لصفحة تسجيل الدخول
        function handleReset() {
            const code = document.getElementById('code').value.trim();
            const pass = document.getElementById('newPassword').value.trim();
            const confirm = document.getElementById('confirmPassword').value.trim();

            if (!code || !pass || !confirm) {
                alert('الرجاء تعبئة جميع الحقول.');
                return;
            }
            if (pass !== confirm) {
                alert('كلمتا المرور غير متطابقتين.');
                return;
            }

            // هنا لاحقًا تضيف استدعاء الـ API الحقيقي
            alert('تم تحديث كلمة المرور (ديمو للمناقشة). سيتم تحويلك لصفحة تسجيل الدخول.');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
